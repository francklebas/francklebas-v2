approach:
  title:
    en: Technical solution
    fr: Solution technique
  body:
    en: "The resume is modeled as structured JSON and stored in Supabase, on Postgres with row-level security. Mistral AI handles generation and tailoring, chosen for its accessibility and its fit for this narrow use case, with a match score against the target posting and a full rewrite history. Existing resumes are imported as PDF, Word or OpenDocument and parsed into the same structure automatically. That single source drives two exports: a design-faithful PDF rendered through headless Chromium, and a plain-text ATS template. GDPR handling was part of the design rather than a later patch, with account export and deletion, explicit consent before any data reaches the model, and per-user AI quotas."
    fr: "Le CV est modélisé en JSON structuré et stocké dans Supabase, sur Postgres avec row-level security. Mistral AI prend en charge la génération et l'adaptation, choisi pour son accessibilité et sa pertinence sur ce cas d'usage précis, avec un score de correspondance face à l'offre visée et un historique complet des réécritures. Les CV existants sont importés en PDF, Word ou OpenDocument et convertis automatiquement dans la même structure. Cette source unique alimente deux exports : un PDF fidèle au design, rendu par Chromium headless, et un template ATS en texte brut. Le RGPD fait partie de la conception plutôt que d'un correctif ultérieur : export et suppression de compte, consentement explicite avant tout envoi de données au modèle, et quotas IA par utilisateur."
context:
  title:
    en: Context
    fr: Contexte
  body:
    en: "After six years living in Sweden, I moved back to France and ran into a concrete problem: the French market expects a different resume from the one I had, and every application needed its own rewrite. So I built the tool I needed. ResumeAI keeps my career as one structured record and generates a version aligned with a given job posting from it, instead of me maintaining a dozen diverging files."
    fr: "Après six ans en Suède, je suis rentré en France et me suis heurté à un problème concret : le marché français attend un CV différent de celui que j'avais, et chaque candidature demandait sa propre réécriture. J'ai donc construit l'outil dont j'avais besoin. ResumeAI conserve mon parcours sous la forme d'une source structurée unique et en génère une version alignée sur une offre donnée, au lieu de maintenir une douzaine de fichiers qui divergent."
