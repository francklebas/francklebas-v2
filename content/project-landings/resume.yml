key: resume
results:
  title:
    en: Impact
    fr: Impact
  body:
    en: "The structured source is what makes the output trustworthy. Starting from a job posting alone produces a scaffold aligned with the role, which I fill and validate; from then on, that validated source defines what the model is allowed to claim, so it reformulates and reprioritizes instead of inventing. Tailoring to a new posting takes about 12 minutes, and adjusting an existing version 3 to 4, with PDF and ATS regenerated together instead of drifting apart. Six real applications went through the complete workflow, from import to targeted generation to dual export.\n\nBuilt solo, first commit on July 8 to production on August 8, 2026. Seven business API endpoints, five schema migrations shipped to production without downtime, strict TypeScript throughout, Playwright end-to-end coverage on the critical path, edge deployment on Cloudflare Workers, error monitoring piped to Discord."
    fr: "C'est la source structurée qui rend le résultat fiable. Partir d'une offre seule produit une trame alignée sur le poste, que je complète et valide ; à partir de là, cette source validée définit ce que le modèle a le droit d'affirmer : il reformule et repriorise au lieu d'inventer. Cibler une nouvelle offre prend environ 12 minutes, ajuster une version existante 3 à 4, avec PDF et ATS régénérés ensemble au lieu de diverger. Six candidatures réelles sont passées par le parcours complet, de l'import à la génération ciblée jusqu'au double export.\n\nRéalisé en solo, du premier commit le 8 juillet à la mise en production le 8 août 2026. Sept endpoints API métier, cinq migrations de schéma livrées en production sans interruption, TypeScript strict partout, couverture end-to-end Playwright sur le parcours critique, déploiement edge sur Cloudflare Workers, monitoring des erreurs relayé sur Discord."
