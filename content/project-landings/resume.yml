approach:
  title:
    en: Technical solution
    fr: Solution technique
  body:
    en: "Resume modeled as structured JSON with Supabase CRUD (Postgres + RLS), generation and tailoring via Mistral AI (chosen for its accessibility and fit for this specific use case), with a match score and version history. Importing existing resumes (PDF, Word, OpenDocument) with automatic AI extraction. Two export formats from a single source: a design-faithful PDF (headless Chromium rendering) and a plain-text ATS template. GDPR compliance built in from the start (account export/deletion, explicit consent before sending content to the AI). One month from first commit to production (July 8 to August 8, 2026), solo."
    fr: "CV modélisé en JSON structuré avec CRUD Supabase (Postgres + RLS), génération et adaptation via Mistral AI (choisi pour son accessibilité et sa pertinence sur ce cas d'usage précis), avec score de matching et historique de versions. Import de CV existants (PDF, Word, OpenDocument) avec extraction automatique par IA. Export en deux formats à partir d'une même source : PDF fidèle au design (rendu Chromium headless) et template ATS en texte simple. Conformité RGPD intégrée dès la conception (export/suppression de compte, consentement explicite avant tout envoi à l'IA). Un mois du premier commit à la mise en production (8 juillet au 8 août 2026), en solo."
context:
  title:
    en: Context
    fr: Contexte
  body:
    en: "Returning to France after 6 years abroad in Sweden, I needed to realign my job applications with the French market. Instead of reworking a resume for every application, I built ResumeAI: generate, tailor to a job posting, and keep a resume up to date from a single structured content source."
    fr: "De retour en France après 6 ans d'expatriation en Suède, j'avais besoin de réaligner mes candidatures avec le marché français. Plutôt que de retoucher un CV à chaque candidature, j'ai développé ResumeAI : générer, adapter à une offre d'emploi et maintenir à jour un CV à partir d'un contenu structuré unique."
hero:
  title:
    en: ResumeAI — Solo AI resume-adaptation SaaS
    fr: ResumeAI — SaaS solo d'adaptation de CV par IA
  body:
    en: Solo design and development of a SaaS application turning resume creation into an AI-assisted process, from zero to production in 1 month.
    fr: Conception et développement solo d'une application SaaS transformant la création de CV en processus assisté par IA, de zéro à la mise en production en 1 mois.
  image: /images/resume-hero.png
  cta:
    label:
      en: Try the demo
      fr: Tester la démo
    href: https://resume.francklebas.com
key: resume
results:
  title:
    en: Impact
    fr: Impact
  body:
    en: 7 business API endpoints, 5 schema migrations shipped to production without downtime, 100% strict TypeScript, a Playwright end-to-end test suite on the critical path, edge deployment via Cloudflare Workers. 6 resumes generated and/or corrected in real use, validating the full flow under real application conditions.
    fr: 7 endpoints API métier, 5 migrations de schéma en production sans interruption de service, 100% TypeScript strict, suite de tests end-to-end Playwright sur le parcours critique, déploiement edge via Cloudflare Workers. 6 CV générés et/ou corrigés en usage réel, validant le parcours complet en conditions concrètes de candidature.
