key: aube
hero:
  title:
    en: "Aube: a wake-up alarm that leaves the ringing to the iPhone"
    fr: "Aube : un réveil qui laisse l'iPhone sonner"
  body:
    en: "A personal iPhone alarm and sleep tracker. The web app no longer rings by itself: it drives the iOS Clock through Shortcuts, logs every event of the night offline, and turns the nights into trends. Built in October 2026: architecture, Cloudflare Worker and D1 database, Vue 3 PWA, and step-by-step guides for the Shortcuts that cannot be generated by code."
    fr: "Un réveil et un suivi du sommeil personnels pour iPhone. L'application web ne sonne plus elle-même : elle pilote l'Horloge iOS via Raccourcis, note chaque événement de la nuit hors ligne, et transforme les nuits en tendances. Réalisé en octobre 2026 : architecture, Worker Cloudflare et base D1, PWA Vue 3, et guides pas à pas pour les raccourcis, qu'aucun code ne peut générer."
  image: /images/aube-hero.webp
  cta:
    label:
      en: "View the code on GitHub"
      fr: "Voir le code sur GitHub"
    href: https://github.com/francklebas/aube
context:
  title:
    en: The problem
    fr: Le problème
  body:
    en: "The first version of Aube was a classic web alarm: the page played the sound itself. On iOS, that cannot be relied on. As soon as the screen locks, Safari suspends the page and the alarm never rings. A web app cannot schedule a system alarm either: there is no API for it. Keeping the screen on all night only moves the problem."
    fr: "La première version d'Aube était un réveil web classique : la page jouait elle-même la sonnerie. Sur iOS, on ne peut pas s'y fier. Dès que l'écran se verrouille, Safari suspend la page et l'alarme ne sonne jamais. Une application web ne peut pas non plus programmer une alarme système : aucune API ne le permet. Garder l'écran allumé toute la nuit ne fait que déplacer le problème."
approach:
  title:
    en: The solution
    fr: La solution
  body:
    en: |-
      Give each part of the system the one job it does reliably, and keep anything critical out of the web page.

      - The iOS Clock rings, including in airplane mode. A Shortcut sets a dedicated alarm each evening instead of adding a new one every night.
      - Shortcuts carry the logic: bedtime, alarm set, snoozes, alarm stopped and getting up are appended to a local file, one line per event, with an ISO timestamp and its time zone. Two automations log snoozes and stops without any network.
      - In the morning, a Shortcut turns airplane mode off, waits for the network, sends the file to a Cloudflare Worker, and deletes it only once the Worker confirms. Any failure keeps the file.
      - The Worker and its D1 database are the source of truth. Sending the same file twice creates no duplicates, unreadable lines are kept aside instead of lost, and a single rule decides which night an event belongs to.
      - The Vue 3 PWA only triggers the Shortcuts and shows the trends: bedtime, wake-up and getting-up times, time in bed, snoozes, and a short morning check-in. It opens offline, in airplane mode, from its service worker.
    fr: |-
      Confier à chaque partie du système la seule tâche qu'elle fait de façon fiable, et ne rien laisser de critique dans la page web.

      - L'Horloge iOS sonne, y compris en mode avion. Chaque soir, un raccourci règle une alarme dédiée au lieu d'en ajouter une nouvelle.
      - Raccourcis porte la logique : coucher, alarme réglée, snoozes, arrêt de l'alarme et lever sont ajoutés à un fichier local, une ligne par événement, avec un horodatage ISO et son fuseau. Deux automatisations notent les snoozes et les arrêts sans aucun réseau.
      - Le matin, un raccourci coupe le mode avion, attend le réseau, envoie le fichier à un Worker Cloudflare, et ne le supprime qu'une fois l'envoi confirmé. Toute erreur conserve le fichier.
      - Le Worker et sa base D1 font foi. Renvoyer deux fois le même fichier ne crée aucun doublon, les lignes illisibles sont mises de côté plutôt que perdues, et une règle unique décide de la nuit à laquelle appartient un événement.
      - La PWA Vue 3 ne fait que lancer les raccourcis et afficher les tendances : heures de coucher, de réveil et de lever, temps au lit, snoozes, et un court ressenti au réveil. Elle s'ouvre hors ligne, en mode avion, grâce à son service worker.
results:
  title:
    en: What it shows
    fr: Ce que ça démontre
  body:
    en: "Accepting the limits of the platform instead of fighting them. Before writing code, I checked which Shortcuts actions actually exist, and the design follows from what they allow. The result is a system where the web app can fail without consequence: the alarm still rings, and no night is lost."
    fr: "Accepter les limites de la plateforme plutôt que de lutter contre elles. Avant d'écrire du code, j'ai vérifié quelles actions Raccourcis existent réellement, et la conception découle de ce qu'elles permettent. Le résultat est un système où l'application web peut tomber sans conséquence : l'alarme sonne quand même, et aucune nuit n'est perdue."
